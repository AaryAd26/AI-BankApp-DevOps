name: secrets scan

on: 
    workflow_call:

jobs: 
    scan-secrets:
        runs-on: ubuntu-latest
        steps:
            - name: checkout the code
              uses: actions/checkout@v4
              with: 
                fetch-depth: 0 #This is used because github needs full history of commits 

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
