name: code quality

on:
  workflow_call:

jobs:

  # ─── Java version compatibility ───
  validate:
    name: Java ${{ matrix.java-version }} - version check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "23"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Verify build on Java ${{ matrix.java-version }}
        run: mvn compile -DskipTests

  # ─── Lint + SAST ───
  lint-and-sast:
    name: Lint & SAST - Checkstyle + SpotBugs
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Checkstyle (Lint)
        run: mvn checkstyle:check

      - name: Compile
        run: mvn compile -DskipTests

      - name: Run SpotBugs + FindSecBugs (SAST)
        run: mvn spotbugs:check
        continue-on-error: true

      - name: Upload SpotBugs SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: target/spotbugs.sarif
          category: spotbugs