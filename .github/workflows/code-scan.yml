name: code quality

on: 
    workflow_call:

jobs:
    scan-code:
        runs-on: ubuntu-latest
        permissions:
          security-events: write
          packages: read
          actions: read

        steps:
        - name: code scanning
          uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '21'
            cache: 'maven'
        
        - name: Run Linters with Maven
          run: mvn checkstyle:check pmd:check spotbugs:check