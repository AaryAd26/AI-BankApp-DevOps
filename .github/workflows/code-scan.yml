name: code quality

on:
  workflow_call:

jobs:
  code-quality:
    name: Lint & SAST - Checkstyle + SpotBugs
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Checkstyle (lint)
        run: mvn checkstyle:check

      - name: Compile
        run: mvn compile -DskipTests

      - name: Run SpotBugs (SAST)
        run: mvn spotbugs:check

      - name: Upload SpotBugs SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: target/spotbugs.sarif
          category: spotbugs

  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/owasp-top-ten
            p/secrets


      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep